<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">

<style>
  /* Halaman ini hanya "bingkai": aplikasi aslinya tetap di Google Apps Script. */
  :root { --bg: #F1F4F6; --ink: #16252D; --muted: #5E6E77; --accent: #1F5C5C; }
  html { touch-action: manipulation; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
  /* ---- loading: intro gaya Pixar. Titik "." melompat, setiap huruf NEY.MA tumbuh & mengangkat titik, lalu WELLNESS diketik ---- */
  #wait { position: fixed; inset: 0; z-index: 5; background: #fff; display: grid; place-content: center; justify-items: center; gap: 20px; transition: opacity .3s; }
  #wait.out { opacity: 0; pointer-events: none; }
  #wait[hidden] { display: none; }
  #nm { width: min(80vw, 350px); height: auto; overflow: visible; }
  #nm path { fill: none; stroke: #111; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
  #nm .lt { transform-box: fill-box; transform-origin: 50% 100%; }
  #ball { fill: #111; }

  .ldg { font: 600 10px/1 "Helvetica Neue", Arial, sans-serif; letter-spacing: .4em; margin-right: -.4em; color: #111; opacity: 0; transition: opacity .4s; }
  .ldg.on { animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 0%, 100% { opacity: .45; } 50% { opacity: .12; } }
  #slow { position: absolute; left: 16px; right: 16px; bottom: calc(24px + env(safe-area-inset-bottom)); margin: 0; text-align: center; font-size: 14px; color: #5E6E77; }
  #slow a { color: #111; font-weight: 700; }
  /* ---- printer bluetooth (Web Bluetooth harus di halaman paling luar) ---- */
  #pr { position: fixed; inset: 0; z-index: 10; display: grid; place-content: center; padding: 16px; background: rgba(0,0,0,.5); }
  #pr[hidden], #sh[hidden] { display: none; }
  #sh { position: fixed; inset: 0; z-index: 11; display: grid; place-content: center; padding: 16px; background: rgba(0,0,0,.5); }
  #pr .box, #sh .box { background: #fff; color: #16252D; border-radius: 14px; padding: 20px; max-width: 360px; display: grid; gap: 12px; font-size: 15px; }
  #pr h2, #sh h2 { margin: 0; font-size: 18px; }
  #pr p, #sh p { margin: 0; color: #5E6E77; font-size: 14px; }
  #pr .err, #sh .err { color: #B42318; font-weight: 600; }
  #pr button, #sh button { font: inherit; font-weight: 700; border-radius: 10px; padding: 14px; border: 1px solid #DCE3E7; background: #fff; color: #16252D; }
  #pr button.pri, #sh button.pri { background: #1F5C5C; border-color: #1F5C5C; color: #fff; font-size: 16px; }

</head>

  <svg id="nm" viewBox="-14 -60 568 262" aria-label="NEY.MA">
    <g class="lt" id="L0"><path d="M10,180 V50 A30,30 0 0 1 70,50 V180"/></g>
    <g class="lt" id="L1"><path d="M100,105 H146"/><path d="M150,38 A30,30 0 0 0 100,58 V152 A30,30 0 0 0 150,172"/></g>
    <g class="lt" id="L2"><path d="M214,180 V140"/><path d="M184,20 V110 A30,30 0 0 0 244,110 V20"/></g>
    <g class="lt" id="L3"><path d="M320,180 V50 A30,30 0 0 1 380,50 A30,30 0 0 1 440,50 V180"/><path d="M380,180 V50"/></g>
    <g class="lt" id="L4"><path d="M472,180 V50 A30,30 0 0 1 532,50 V180"/><path d="M472,112 H532"/></g>

  <div class="well" id="well"></div>
  <div class="ldg" id="ldg">LOADING</div>

</div>
<iframe id="app" title="Neyma Backoffice" allow="clipboard-write"></iframe>
<div id="sh" hidden role="dialog" aria-modal="true" aria-labelledby="shT" class="ovl"><div class="box">

  <button id="shNo">Tutup</button>
</div></div>
<div id="pr" hidden role="dialog" aria-modal="true" aria-labelledby="prT"><div class="box">
  <h2 id="prT">&#128424; Printer bluetooth</h2>

  <button id="prAll" hidden>Printer tidak ada di daftar? Tampilkan semua perangkat</button>
  <button id="prNo">Batal</button>
</div></div>
<script>
  // GANTI link di bawah ini kalau link /exec Google Apps Script Anda berubah.

  var f = document.getElementById("app"), w = document.getElementById("wait");
  document.getElementById("direct").href = APP_URL;
  /* Intro penuh pada pembukaan pertama setiap hari; berikutnya versi cepat. Hilang setelah intro selesai DAN aplikasi siap. */
  var today = new Date().toDateString(), SPEED = 1.8, TA = 0, LAST = null;
  try { if (localStorage.getItem("neyma_intro") === today) SPEED = 3.5; else localStorage.setItem("neyma_intro", today); } catch (e) { }

  var ball = document.getElementById("ball"), G = 172, LET = [0, 1, 2, 3, 4].map(function (i) { return document.getElementById("L" + i); });
  var LX = [40, 125, 214, 380, 502], DOT = 282;
  LET.forEach(function (g) { g.style.opacity = 0; [].forEach.call(g.querySelectorAll("path"), function (p) { var L = Math.ceil(p.getTotalLength()) + 2; p.style.strokeDasharray = L + " " + L; p.style.strokeDashoffset = L; p._L = L; }); });
  function ease(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

  var intro = landDot + .2, wellAt = landDot + .15, ready = false, finished = false, T0 = null;

      [].forEach.call(g.querySelectorAll("path"), function (p, n) { var kn = Math.max(0, Math.min(1, (d - n * .08) / .45)); p.style.strokeDashoffset = p._L * (1 - back(kn)); }); });
    if (t >= wellAt) { var n = Math.min(8, Math.floor((t - wellAt) / .07) + 1); document.getElementById("well").textContent = "WELLNESS".slice(0, n); if (n === 8) document.getElementById("ldg").classList.add("on"); }

    if (finished && ready) { document.getElementById("ldg").classList.remove("on"); document.getElementById("ldg").style.opacity = 0; w.classList.add("out"); setTimeout(function () { w.hidden = true; }, 350); return; }

  requestAnimationFrame(frame);
  function finishLoading() { ready = true; }
  window.addEventListener("message", function (e) { var m = e.data; if (m && typeof m === "object" && m.neyma === "ready" && okOrigin(e.origin)) finishLoading(); });
  f.addEventListener("load", function () { setTimeout(finishLoading, 12000); });
  setTimeout(function () { if (!ready) document.getElementById("slow").hidden = false; }, 15000);
  f.src = APP_URL;

  /* ===== APLIKASI DI HP (PWA) ===== */
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () { });
  var installEvt = null;
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); installEvt = e; status(); });
  window.addEventListener("appinstalled", function () { installEvt = null; status(); });
  function standalone() { return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true; }

  /* ===== PRINTER BLUETOOTH (Web Bluetooth, Chrome Android) =====
   * Aplikasi di dalam bingkai mengirim perintah lewat postMessage; halaman ini yang memegang koneksi printer.
   * Printer thermal BLE memakai salah satu service di bawah; dicari karakteristik yang bisa ditulis. */
  var SVC = ["000018f0-0000-1000-8000-00805f9b34fb", "0000ff00-0000-1000-8000-00805f9b34fb", "e7810a71-73ae-499d-8c15-faa9aef0c3f2",
    "49535343-fe7d-4ae5-8fa9-9fafd205e455", "0000ffe0-0000-1000-8000-00805f9b34fb", "0000fee7-0000-1000-8000-00805f9b34fb",
    "0000ae30-0000-1000-8000-00805f9b34fb", "0000ae3a-0000-1000-8000-00805f9b34fb", "0000ff12-0000-1000-8000-00805f9b34fb",
    "0000fff0-0000-1000-8000-00805f9b34fb", "0000ffb0-0000-1000-8000-00805f9b34fb", "0000ae00-0000-1000-8000-00805f9b34fb"];
  var NAMES = ["Printer", "PRINTER", "printer", "BlueTooth Printer", "BT Printer", "POS", "Pos", "RPP", "MTP", "MPT", "PT-", "PT2", "PT8", "P58", "P80", "58", "80",
    "XP-", "XP", "ZJ", "GOOJPRT", "EPPOS", "EP5", "Panda", "PANDA", "Thermal", "MP", "RP", "Inner", "InnerPrinter", "IposPrinter", "HM-", "HOIN", "ZCS", "Xprinter", "Zjiang", "SPRT", "QS", "YHD", "BlueTooth", "Bluetooth Printer"];
  var FILTERS = SVC.map(function (u) { return { services: [u] }; }).concat(NAMES.map(function (n) { return { namePrefix: n }; }));
  var bt = navigator.bluetooth, dev = null, chr = null, app = null, appOrigin = null, pending = null, state = "off", manualOff = false, lastErr = "";
  var pr = document.getElementById("pr"), prMsg = document.getElementById("prMsg"), prErr = document.getElementById("prErr"), prGo = document.getElementById("prGo"), prAll = document.getElementById("prAll");
  function okOrigin(o) { return o === "https://script.google.com" || /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(o); }

  function connected() { return !!(dev && chr && dev.gatt && dev.gatt.connected); }
  function status() {
    if (connected()) state = "on"; else if (state === "on") state = "off";
    send({ neyma: "printer", supported: !!bt, connected: connected(), state: state, name: dev ? (dev.name || "Printer") : "", err: lastErr,
      canInstall: !!installEvt, standalone: standalone() });
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  async function findChar(server) {
    var list = await server.getPrimaryServices(), best = null;
    for (var i = 0; i < list.length; i++) {
      var cs = await list[i].getCharacteristics();
      for (var j = 0; j < cs.length; j++) { var p = cs[j].properties; if (p.writeWithoutResponse || p.write) { if (!best || (p.writeWithoutResponse && !best.properties.writeWithoutResponse)) best = cs[j]; } }
    }

  }

    catch (e) { state = "off"; lastErr = (e && e.message) || String(e); status(); throw e; }

    try { localStorage.setItem("neyma_printer", d.id); } catch (e) { }
    state = "on"; status();
  }
  /* Koneksi putus (printer mati / jauh): coba sambung lagi sendiri beberapa kali. */

    state = "connecting"; status();

      try { await attach(d); return; } catch (e) { }

  }

  /* ===== BAGIKAN FILE PDF (menu Bagikan Android -> WhatsApp) ===== */
  var shJob = null, sh = document.getElementById("sh"), shErr = document.getElementById("shErr");
  function pdfFile(m) { return new File([bytesOf(m.b64)], m.name || "Invoice.pdf", { type: "application/pdf" }); }
  /* Kotak "Bagikan PDF" selalu ditampilkan di halaman ini, supaya ketukan kasir langsung diterima Chrome

  }
  document.getElementById("shGo").onclick = async function () {

    catch (x) { if (x && x.name === "AbortError") return; shErr.textContent = "Gagal membagikan (" + ((x && x.name) || "") + ": " + ((x && x.message) || x) + "). Coba Unduh PDF."; shErr.hidden = false; }
  };

    document.body.appendChild(a); a.click(); a.remove(); send({ neyma: "shared", ok: true, id: shJob.id, dl: true });
  };
  document.getElementById("shNo").onclick = function () { sh.hidden = true; shJob = null; };
  window.addEventListener("message", async function (e) {
    var m = e.data; if (!m || typeof m !== "object" || !m.neyma || !okOrigin(e.origin)) return;
    app = e.source; appOrigin = e.origin;
    if (m.neyma === "hello") { status(); if (bt && bt.getDevices && !connected() && !manualOff) { try { await ensure(); } catch (x) { } } return; }
    if (m.neyma === "connect") { manualOff = false; if (m.all) choose(true); else choose(false); return; }
    if (m.neyma === "reconnect") { manualOff = false; try { await ensure(); } catch (x) { choose(false); } return; }
    if (m.neyma === "disconnect") { manualOff = true; try { if (dev && dev.gatt.connected) dev.gatt.disconnect(); } catch (x) { } chr = null; state = "off"; status(); return; }
    if (m.neyma === "forget") { manualOff = true; try { if (dev && dev.gatt.connected) dev.gatt.disconnect(); if (dev && dev.forget) await dev.forget(); } catch (x) { } dev = null; chr = null; state = "off"; try { localStorage.removeItem("neyma_printer"); } catch (x) { } status(); return; }
    if (m.neyma === "install") { if (installEvt) { try { installEvt.prompt(); var c = await installEvt.userChoice; if (c && c.outcome === "accepted") installEvt = null; } catch (x) { } } status(); return; }
    if (m.neyma === "share") { sharePdf(m); return; }
    if (m.neyma === "print") {
      if (!bt) { send({ neyma: "printed", ok: false, id: m.id, err: "NOBT" }); return; }
      try { await doPrint(m); }
      catch (x) { if (x && x.message === "PILIH") choose(false, m); else { chr = null; ask(m, "Gagal mencetak: " + ((x && x.message) || x) + ". Coba sambungkan lagi."); } }
    }
  });
</script>
